<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스페인어 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efe6d3;
    --paper-deep:#e4d7b9;
    --ink:#2c2620;
    --ink-soft:#6b5f4f;
    --clay:#b0472e;
    --clay-deep:#8f3a25;
    --azul:#2c5a73;
    --azul-deep:#1f4356;
    --gold:#d9a441;
    --green:#3d7a4f;
    --card-shadow: 0 1px 0 rgba(44,38,32,0.06), 0 20px 40px -20px rgba(44,38,32,0.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(176,71,46,0.10), transparent 42%),
      radial-gradient(circle at 88% 90%, rgba(44,90,115,0.12), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
  }

  .app{
    width:100%;
    max-width:560px;
  }

  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
    padding:0 4px;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    letter-spacing:0.01em;
    color:var(--ink);
  }
  .brand em{
    color:var(--clay);
    font-style:normal;
  }
  .stats{
    display:flex;
    gap:14px;
    font-size:13px;
    color:var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .stats b{color:var(--ink); font-weight:600;}
  .stats .ok b{color:var(--green);}
  .stats .no b{color:var(--clay);}

  .card{
    background:var(--paper-deep);
    border-radius:20px;
    box-shadow:var(--card-shadow);
    padding:44px 36px 32px;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(44,38,32,0.06);
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:6px;
    background:linear-gradient(90deg, var(--clay) 0 33%, var(--paper-deep) 33% 34%, var(--gold) 34% 66%, var(--paper-deep) 66% 67%, var(--azul) 67% 100%);
    opacity:0.85;
  }

  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:26px;
  }
  .progress-row .cycle{
    letter-spacing:0.02em;
  }
  .progress-track{
    flex:1;
    height:3px;
    margin:0 12px;
    background:rgba(44,38,32,0.10);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--clay);
    width:0%;
    transition:width .25s ease;
  }

  .word-zone{
    text-align:center;
    margin-bottom:30px;
  }
  .es-word{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(34px, 8vw, 50px);
    line-height:1.15;
    color:var(--ink);
    word-break:break-word;
  }

  .answer-row{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  #answer{
    flex:1;
    font-family:'Noto Sans KR', sans-serif;
    font-size:17px;
    padding:14px 16px;
    border-radius:12px;
    border:1.5px solid rgba(44,38,32,0.16);
    background:var(--paper);
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  #answer:focus{
    border-color:var(--azul);
    box-shadow:0 0 0 3px rgba(44,90,115,0.15);
  }
  #answer:disabled{
    color:var(--ink-soft);
  }
  #answer.correct{ border-color:var(--green); background:#eaf3ea; }
  #answer.wrong{ border-color:var(--clay); background:#f6e9e5; }

  .go-btn{
    flex:none;
    width:52px;
    border:none;
    border-radius:12px;
    background:var(--azul);
    color:#fff;
    font-size:18px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .go-btn:hover{background:var(--azul-deep);}
  .go-btn:active{transform:scale(0.95);}

  .reveal{
    min-height:64px;
    border-radius:12px;
    padding:14px 16px;
    font-size:15px;
    line-height:1.55;
    display:none;
    align-items:flex-start;
    gap:10px;
  }
  .reveal.show{ display:flex; }
  .reveal.is-correct{ background:#eaf3ea; color:#28532f; }
  .reveal.is-wrong{ background:#f6e9e5; color:#7c3020; }
  .reveal .verdict{
    font-weight:700;
    flex:none;
    font-family:'Noto Sans KR', sans-serif;
  }
  .reveal .meaning{
    flex:1;
  }
  .reveal .meaning b{
    display:block;
    font-size:16px;
    margin-bottom:2px;
  }

  .hint{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:18px;
  }
  .hint kbd{
    background:rgba(44,38,32,0.08);
    border-radius:5px;
    padding:1px 7px;
    font-family:inherit;
    font-size:11.5px;
  }

  .set-card{
    background:rgba(255,255,255,0.42);
    border:1px solid rgba(44,38,32,0.10);
    border-radius:14px;
    padding:14px 16px 12px;
    margin-bottom:12px;
  }
  .set-title{
    font-size:13px;
    font-weight:700;
    margin-bottom:9px;
  }
  .set-label{
    display:block;
    font-size:11.5px;
    color:var(--ink-soft);
    margin:10px 0 5px;
  }
  .set-select{
    width:100%;
    box-sizing:border-box;
    border:1px solid rgba(44,38,32,0.18);
    background:rgba(255,255,255,0.7);
    border-radius:9px;
    padding:9px 11px;
    font:inherit;
    font-size:14px;
    color:var(--ink);
    outline:none;
  }
  .set-select:focus{border-color:var(--azul); box-shadow:0 0 0 2px rgba(44,90,115,0.10);}
  .set-row{display:flex; gap:7px;}
  #wordLimit{
    flex:1; min-width:0; border:1px solid rgba(44,38,32,0.18);
    background:rgba(255,255,255,0.7); border-radius:9px; padding:9px 11px;
    font:inherit; font-size:14px; color:var(--ink); outline:none;
  }
  #wordLimit:focus{border-color:var(--azul); box-shadow:0 0 0 2px rgba(44,90,115,0.10);}
  .set-btn{
    border:0; border-radius:9px; padding:0 16px; background:var(--azul);
    color:white; font:inherit; font-size:13px; font-weight:700; cursor:pointer;
  }
  .set-btn:active,.quick-btn:active{transform:scale(0.97);}
  .quick-row{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .quick-btn{
    border:1px solid rgba(44,38,32,0.12); background:rgba(255,255,255,0.45);
    color:var(--ink-soft); border-radius:999px; padding:5px 10px;
    font:inherit; font-size:11.5px; cursor:pointer;
  }
  .quick-btn:hover{border-color:var(--azul); color:var(--azul);}
  .set-help{font-size:11.5px; color:var(--ink-soft); margin-top:8px; line-height:1.45;}

  .save-status{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:10px;
    min-height:18px;
  }

  .settings-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:14px;
  }
  .settings-toggle{
    display:flex;
    align-items:center;
    gap:7px;
    border:1px solid rgba(44,38,32,0.14);
    background:rgba(255,255,255,0.62);
    color:var(--ink-soft);
    border-radius:999px;
    padding:7px 13px;
    font:inherit;
    font-size:12px;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(44,38,32,0.04);
  }
  .settings-toggle:hover{border-color:var(--azul); color:var(--azul);}
  .settings-toggle .chevron{font-size:10px; transition:transform .2s ease;}
  .settings-toggle.open .chevron{transform:rotate(180deg);}
  .set-card{
    width:100%;
    box-sizing:border-box;
    overflow:hidden;
    max-height:0;
    opacity:0;
    transform:translateY(-5px);
    padding:0 18px;
    margin:0;
    transition:max-height .25s ease, opacity .2s ease, transform .25s ease, padding .25s ease, margin .25s ease;
  }
  .set-card.open{
    max-height:260px;
    opacity:1;
    transform:translateY(0);
    padding:16px 18px;
    margin:8px 0 14px;
  }

  .footer-row{
    display:flex;
    justify-content:center;
    margin-top:16px;
  }
  .reset-btn{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    padding:4px 8px;
  }
  .reset-btn:hover{ color:var(--clay); }

  @media (max-width: 600px){
    body{padding:14px 10px; align-items:flex-start;}
    .app{max-width:100%; margin-top:2vh;}
    .topbar{margin-bottom:12px; padding:0 2px;}
    .brand{font-size:18px;}
    .stats{font-size:12px; gap:9px;}
    .card{padding:34px 16px 24px; border-radius:16px;}
    .progress-row{margin-bottom:22px;}
    .es-word{font-size:clamp(32px, 11vw, 48px);}
    .word-zone{margin-bottom:22px;}
    .answer-row{gap:7px;}
    #answer{font-size:16px; min-width:0; padding:13px 13px;}
    .go-btn{width:48px;}
    .reveal{font-size:14px; min-height:58px;}
    .hint{margin-top:14px;}
  }

  @media (max-width: 360px){
    .stats{gap:6px;}
    .card{padding-left:12px; padding-right:12px;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">Vocabu<em>lario</em></div>
    <div class="stats">
      <span class="ok">정답 <b id="okCount">0</b></span>
      <span class="no">오답 <b id="noCount">0</b></span>
    </div>
  </div>

  <div class="settings-wrap">
    <button class="settings-toggle" id="settingsToggle" type="button" aria-expanded="false">
      <span id="settingsToggleText">학습 단어 수 설정</span>
      <span class="chevron">▼</span>
    </button>
    <div class="set-card" id="setCard">
      <div class="set-title">학습 범위 설정</div>
      <label class="set-label" for="startLetter">시작 글자</label>
      <select id="startLetter" class="set-select">
        <option value="all">전체</option>
        <option value="a">A</option><option value="b">B</option><option value="c">C</option>
        <option value="d">D</option><option value="e">E</option><option value="f">F</option>
        <option value="g">G</option><option value="h">H</option><option value="i">I</option>
        <option value="j">J</option><option value="k">K</option><option value="l">L</option>
        <option value="m">M</option><option value="n">N</option><option value="o">O</option>
        <option value="p">P</option><option value="q">Q</option><option value="r">R</option>
        <option value="s">S</option><option value="t">T</option><option value="u">U</option>
        <option value="v">V</option><option value="w">W</option><option value="x">X</option>
        <option value="y">Y</option><option value="z">Z</option><option value="ñ">Ñ</option>
      </select>

      <label class="set-label" for="wordLimit">학습할 단어 수</label>
      <div class="set-row">
        <input id="wordLimit" type="number" min="1" placeholder="전체" inputmode="numeric">
        <button id="applyLimitBtn" class="set-btn">설정</button>
      </div>
      <div class="quick-row">
        <button class="quick-btn" data-limit="20">20개</button>
        <button class="quick-btn" data-limit="50">50개</button>
        <button class="quick-btn" data-limit="100">100개</button>
        <button class="quick-btn all" data-limit="all">전체</button>
      </div>
      <div class="set-help" id="setHelp">현재 전체 단어를 랜덤으로 학습합니다.</div>
    </div>
  </div>

  <div class="card">
    <div class="progress-row">
      <span id="cycleLabel" class="cycle">1회독</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span id="progressLabel">0 / 0</span>
    </div>

    <div class="word-zone">
      <div class="es-word" id="esWord">·</div>
    </div>

    <div class="answer-row">
      <input id="answer" type="text" placeholder="뜻을 한글로 입력하세요" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="go-btn" id="goBtn" title="확인 / 다음">↵</button>
    </div>

    <div class="reveal" id="reveal">
      <span class="verdict" id="verdict"></span>
      <span class="meaning" id="meaning"></span>
    </div>

    <div class="hint" id="hintText">뜻을 입력하고 <kbd>Enter</kbd>를 누르세요</div>
  </div>

  <div class="footer-row">
    <button class="reset-btn" id="resetBtn">기록 초기화</button>
  </div>
  <div class="save-status" id="saveStatus">학습 기록이 이 기기에 자동 저장됩니다.</div>
</div>

  const progressFillEl = document.getElementById('progressFill');
  const progressLabelEl = document.getElementById('progressLabel');
  const cycleLabelEl = document.getElementById('cycleLabel');
  const resetBtn = document.getElementById('resetBtn');
  const saveStatusEl = document.getElementById('saveStatus');
  const wordLimitEl = document.getElementById('wordLimit');
  const startLetterEl = document.getElementById('startLetter');
  const applyLimitBtn = document.getElementById('applyLimitBtn');
  const setHelpEl = document.getElementById('setHelp');
  const settingsToggle = document.getElementById('settingsToggle');
  const settingsToggleText = document.getElementById('settingsToggleText');
  const setCard = document.getElementById('setCard');

  let queue = [];
  let pos = 0;
  let cycle = 1;
  let current = null;
  let phase = 'answering';
  let okCount = 0;
  let noCount = 0;
  let selectedVocab = null; // 제한 모드에서 고정된 단어 목록
  let selectedLetter = 'all'; // 선택된 시작 글자

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function getBaseVocab(){
    return Array.isArray(selectedVocab) && selectedVocab.length ? selectedVocab : VOCAB;
  }

  function getLetterVocab(letter){
    if(!letter || letter === 'all') return VOCAB;
    return VOCAB.filter(v => v.es && v.es.charAt(0).toLocaleLowerCase('es') === letter);
  }

  function updateSetHelp(){
    const letterText = selectedLetter === 'all' ? '전체' : selectedLetter.toUpperCase() + '로 시작하는';
    if(Array.isArray(selectedVocab) && selectedVocab.length){
      setHelpEl.textContent = '처음 선택된 ' + selectedVocab.length + '개 단어만 계속 반복합니다. 설정을 바꾸기 전까지 같은 단어가 유지됩니다.';
      wordLimitEl.value = selectedVocab.length;
      startLetterEl.value = selectedLetter;
      settingsToggleText.textContent = letterText + ' 단어 · ' + selectedVocab.length + '개 학습 중';
    }else{
      setHelpEl.textContent = '현재 ' + letterText + ' 단어 ' + getLetterVocab(selectedLetter).length + '개를 랜덤으로 학습합니다.';
      wordLimitEl.value = '';
      startLetterEl.value = selectedLetter;
      settingsToggleText.textContent = letterText + ' 단어 학습 중';
    }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        queue, pos, cycle, current, phase, okCount, noCount, selectedVocab, selectedLetter,
        savedAt: new Date().toISOString()
      }));
      saveStatusEl.textContent = '✓ 학습 기록 자동 저장됨';
    }catch(e){
      saveStatusEl.textContent = '이 브라우저에서는 저장할 수 없습니다.';
    }
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return false;
      const st = JSON.parse(raw);
      if(!Array.isArray(st.queue) || !st.queue.length || !st.current) return false;
      queue = st.queue;
      pos = Number.isInteger(st.pos) ? st.pos : 0;
      cycle = Number.isInteger(st.cycle) ? st.cycle : 1;
      current = st.current;
      phase = st.phase === 'revealed' ? 'revealed' : 'answering';
      okCount = Number.isInteger(st.okCount) ? st.okCount : 0;
      noCount = Number.isInteger(st.noCount) ? st.noCount : 0;
      selectedVocab = Array.isArray(st.selectedVocab) && st.selectedVocab.length ? st.selectedVocab : null;
      selectedLetter = st.selectedLetter || 'all';
      okCountEl.textContent = okCount;
      noCountEl.textContent = noCount;
      cycleLabelEl.textContent = cycle + '회독';
      esWordEl.textContent = current.es;
      updateProgress();
      updateSetHelp();
      if(phase === 'revealed'){
        answerEl.disabled = true;
        hintEl.innerHTML = '<kbd>Enter</kbd>를 눌러 다음 단어로';
      } else {
        answerEl.disabled = false;
        hintEl.innerHTML = '뜻을 입력하고 <kbd>Enter</kbd>를 누르세요';
        setTimeout(()=>answerEl.focus(), 50);
      }
      return true;
    }catch(e){ return false; }
  }

  function newCycle(){
    // 제한 모드에서는 selectedVocab 자체는 절대 다시 뽑지 않고,
    // 처음 선택된 같은 단어 묶음만 다음 회독에서도 반복합니다.
    queue = shuffle(getBaseVocab());
    pos = 0;
    cycleLabelEl.textContent = cycle + '회독';
    updateProgress();
  }

  function normalize(s){
    return s.toLowerCase().replace(/[.,;·~()\[\]!?"`\-\s]/g,'');
  }

  function meaningClauses(meaning){
    return meaning.split(/[;,]/).map(s=>s.trim()).filter(Boolean);
  }

  function checkAnswer(userInput, meaning){
    const u = normalize(userInput);
    if(!u) return false;
    const clauses = meaningClauses(meaning);
    for(const c of clauses){
      const nc = normalize(c);
      if(!nc) continue;
      if(nc === u || nc.includes(u) || u.includes(nc)){
        if(u.length >= 2 || nc.length <= 3) return true;
      }
    }
    return false;
  }

  function updateProgress(){
    progressLabelEl.textContent = pos + ' / ' + queue.length;
    progressFillEl.style.width = (queue.length ? (pos / queue.length * 100) : 0) + '%';
  }

  function nextWord(){
    if(pos >= queue.length){
      cycle += 1;
      newCycle();
    }
    current = queue[pos];
    pos += 1;
    updateProgress();
    esWordEl.textContent = current.es;
    answerEl.value = '';
    answerEl.disabled = false;
    answerEl.classList.remove('correct','wrong');
    revealEl.classList.remove('show','is-correct','is-wrong');
    verdictEl.textContent = '';
    meaningEl.textContent = '';
    hintEl.innerHTML = '뜻을 입력하고 <kbd>Enter</kbd>를 누르세요';
    phase = 'answering';
    saveState();
    answerEl.focus();
  }

  function submitAnswer(){
    const userInput = answerEl.value.trim();
    const isCorrect = checkAnswer(userInput, current.kr);
    if(isCorrect){
      okCount += 1;
      okCountEl.textContent = okCount;
      answerEl.classList.add('correct');
      verdictEl.textContent = '정답';
      revealEl.classList.add('show','is-correct');
    }else{
      noCount += 1;
      noCountEl.textContent = noCount;
      answerEl.classList.add('wrong');
      verdictEl.textContent = userInput ? '오답' : '패스';
      revealEl.classList.add('show','is-wrong');
    }
    meaningEl.innerHTML = '<b>' + current.es + '</b>' + current.kr;
    answerEl.disabled = true;
    hintEl.innerHTML = '<kbd>Enter</kbd>를 눌러 다음 단어로';
    phase = 'revealed';
    saveState();
  }

  function handleAdvance(){
    if(!current) return;
    if(phase === 'answering') submitAnswer();
    else nextWord();
  }

  function applyLimit(limitValue){
    const letter = startLetterEl.value || 'all';
    const pool = getLetterVocab(letter);
    let n = Number(limitValue);

    if(pool.length === 0){
      alert(letter.toUpperCase() + '로 시작하는 단어가 없습니다.');
      return;
    }

    selectedLetter = letter;

    if(limitValue === 'all' || limitValue === '' || !Number.isFinite(n)){
      selectedVocab = null;
      wordLimitEl.value = '';
    }else{
      n = Math.floor(n);
      if(n < 1) n = 1;
      if(n > pool.length) n = pool.length;
      // 선택한 글자 범위 안에서 한 번만 랜덤으로 뽑고,
      // 이후 회독에서는 이 동일한 목록만 반복합니다.
      selectedVocab = shuffle(pool).slice(0, n);
      wordLimitEl.value = n;
    }

    okCount = 0;
    noCount = 0;
    cycle = 1;
    okCountEl.textContent = 0;
    noCountEl.textContent = 0;
    newCycle();
    nextWord();
    updateSetHelp();
  }


  settingsToggle.addEventListener('click', function(){
    const isOpen = setCard.classList.toggle('open');
    settingsToggle.classList.toggle('open', isOpen);
    settingsToggle.setAttribute('aria-expanded', String(isOpen));
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      if(e.target.closest && e.target.closest('.settings-panel')) return;
      if(e.target === answerEl && phase === 'answering' && !answerEl.value.trim()){
        e.preventDefault();
        return;
      }
      e.preventDefault();
      handleAdvance();
    }
  });
  goBtn.addEventListener('click', handleAdvance);

  applyLimitBtn.addEventListener('click', function(){
    applyLimit(wordLimitEl.value.trim());
  });

  wordLimitEl.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      // 설정 입력칸의 Enter가 아래 전역 Enter 핸들러까지 전달되지 않도록 합니다.
      e.preventDefault();
      e.stopPropagation();
      applyLimit(wordLimitEl.value.trim());
    }
  });

  document.querySelectorAll('.quick-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>applyLimit(btn.dataset.limit));
  });

  resetBtn.addEventListener('click', function(){
    if(!confirm('학습 기록과 단어 수 설정을 모두 초기화할까요?')) return;
    localStorage.removeItem(STORAGE_KEY);
    selectedVocab = null;
    selectedLetter = 'all';
    okCount = 0; noCount = 0; cycle = 1;
    okCountEl.textContent = 0; noCountEl.textContent = 0;
    newCycle();
    nextWord();
    updateSetHelp();
  });

  if(!loadState()){
    selectedVocab = null;
    updateSetHelp();
    newCycle();
    nextWord();
  }else{
    saveStatusEl.textContent = '✓ 이전 학습 기록을 불러왔습니다';
  }
})();
</script>

</body>
</html>
